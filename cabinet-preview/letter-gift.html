<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>편지 쓰기 — 요니에게 선물 만들기</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="make-gift.css"><link rel="stylesheet" href="theme.css?v=1"><link rel="stylesheet" href="letter-gift.css?v=paper-focus-4"><link rel="stylesheet" href="site-nav.css"></head>
<body class="cabinet-theme"><header><a class="brand" href="landing.html">youniverse<span>♡</span></a><span class="recipient">TO. 요니</span><a class="back-link" href="visitor.html">캐비넷으로 돌아가기 ↗</a></header>
<main class="maker"><nav aria-label="선물 만들기 진행 단계"><ol class="progress"><li><b>01</b> 모양</li><li><b>02</b> 꾸미기</li><li><b>03</b> 포장</li><li aria-current="step"><b>04</b> 편지</li></ol></nav>
<section class="shape-step" aria-labelledby="stepTitle"><h1 id="stepTitle">선물에 편지를 더해요</h1>
<form id="letterForm"><fieldset class="font-options"><legend class="sr-only">편지 글꼴</legend><label data-font="cute"><input type="radio" name="letterFont" value="cute"><span>귀여운 손글씨</span></label><label data-font="neat"><input type="radio" name="letterFont" value="neat"><span>단정한 손글씨</span></label><label data-font="clean"><input type="radio" name="letterFont" value="clean"><span>깔끔한 기본체</span></label></fieldset><div class="letter-desk"><div class="letter-gift" id="letterGift" role="img" aria-label="내가 포장한 선물"></div>
<div class="letter-paper"><div class="letter-heading"><span>To. 요니</span></div>
<label class="sr-only" for="message">편지 내용</label><textarea id="message" name="message" maxlength="200" required placeholder="전하고 싶은 말을 적어봐요." spellcheck="false"></textarea>
<div class="letter-count"><span id="letterCount">0</span> / 200</div>
<div class="instagram-row"><label for="instagram">인스타그램 ID</label><div class="instagram-input"><span aria-hidden="true">@</span><input id="instagram" name="instagram" maxlength="30" placeholder="아이디" autocomplete="off" autocapitalize="none" spellcheck="false" pattern="[A-Za-z0-9_.]+" title="영문, 숫자, 밑줄, 마침표로 입력해 주세요."></div></div><div class="sender-row"><label for="sender">From.</label><input id="sender" name="sender" maxlength="20" required placeholder="보내는 이름" autocomplete="nickname" aria-label="보내는 이름"></div>
</div></div><div class="step-actions"><a class="back-link" href="wrap-gift.html">← 이전</a><button class="next-action" type="submit">선물 보내기</button></div><p id="letterStatus" role="status" class="letter-status"></p></form>
</section></main><script src="gift-art.js?v=round-heart-13"></script><script src="wrap-art.js?v=1"></script><script src="letter-gift.js?v=login-4"></script><script src="site-nav.js?v=home-landing-2"></script></body></html>
